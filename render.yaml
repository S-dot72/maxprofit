# Render — déploiement du COLLECTEUR (étape 2 de la spec §4).
#
# Lisez ceci avant de déployer : sur le plan gratuit de Render, le disque est
# ÉPHÉMÈRE. Il est effacé à chaque déploiement, à chaque redémarrage et après
# chaque mise en veille. Une base SQLite posée dessus disparaît, et vous
# repartez de zéro sans aucun message d'erreur — précisément le scénario contre
# lequel toute la §1 est écrite.
#
# Un disque persistant est une option payante (plan Starter). Le stockage
# durable est donc EXTERNE : PostgreSQL chez Neon depuis le 2026-09-10.
#
# Turso l'a précédé et a coupé les lectures en pleine campagne. Les causes
# étaient chez nous et sont corrigées — payouts répétés à l'identique (95,1 %
# de redondance), synchronisations qui ne poussaient rien, ticks bruts à 97,6 %
# du volume écrit. Le volume est passé de 708 000 lignes par jour à 17 000.
# Mais une base dont le fournisseur peut bloquer les lectures à la frontière
# d'un quota ne convient pas à une collecte de quatorze jours.

services:
  - type: web
    name: maxprofit-collector
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free             # possible SANS disque : la base est chez Neon
    healthCheckPath: /ping # vivacité du processus. /health (503 si la collecte
                           # est morte) est fait pour un moniteur externe, pas
                           # pour l'auto-redémarrage : un redémarrage ne répare
                           # pas une source de données coupée.
    # PAS de disque : le conteneur n'écrit aucun fichier de données. La base
    # est distante, l'offre gratuite convient.
    envVars:
      # Stockage DURABLE. Sans cette variable, la collecte repartirait de zéro
      # à chaque redémarrage. Le code refuse une URL qui n'est pas du
      # PostgreSQL plutôt que de retomber en silence sur le disque local.
      - key: DATABASE_URL
        sync: false
      # Ne PAS écrire les ticks bruts : mesurés à 97,6 % du volume, soit 9,9
      # millions de lignes sur quatorze jours contre 238 000 pour tout le
      # reste. Le backtest du §2 travaille sur les bougies M1, dont le
      # `tick_count` est calculé depuis les ticks avant écriture : il n'y perd
      # rien. Ce qu'on abandonne est l'analyse sous la minute.
      - key: STOCKER_TICKS
        value: "0"
      - key: MIN_PAYOUT_PCT
        value: "92"
      # Les secrets ne sont pas dans ce fichier : ils se saisissent dans le
      # tableau de bord Render, pour ne jamais entrer dans git.
      # Jeton de session du broker. Il EXPIRE : le service alerte alors sur
      # Telegram et attend un jeton neuf, sans redémarrer en boucle. Vous n'avez
      # pas à revenir ici — `capturer_ssid.py --envoyer` le pousse directement.
      - key: POCKET_OPTION_SSID
        sync: false
      # Le jeton reçu en cours de route est réécrit sur le disque ÉPHÉMÈRE du
      # conteneur : il ne survit ni à un redéploiement ni à une mise en veille.
      # C'est `POCKET_OPTION_SSID` ci-dessus qui fait foi au démarrage.
      - key: POCKET_OPTION_SESSION_FILE
        value: /tmp/session.json
      # Alertes et renouvellement à distance. Les deux vont ensemble : un jeton
      # sans identifiant de conversation donnerait un bot sans liste blanche,
      # pilotable par quiconque le découvre.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Facultatif désormais : le bot accepte plusieurs opérateurs, qui
      # s'inscrivent par /start <code>. Le garder évite d'avoir à s'inscrire
      # pour recevoir la première alerte.
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Code d'inscription administrateur. À traiter comme un mot de passe :
      # il donne le droit de changer le compte de courtier collecté.
      - key: TELEGRAM_ACCESS_CODE
        sync: false
      # Facultatif : inscription en consultation seule.
      - key: TELEGRAM_VIEWER_CODE
        sync: false
      # Secret partagé protégeant POST /session. Sans lui la route répond 404 :
      # un point d'entrée acceptant un jeton sans authentification permettrait
      # de détourner la collecte vers un autre compte.
      - key: ADMIN_SECRET
        sync: false
