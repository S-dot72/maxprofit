# Render — déploiement du COLLECTEUR (étape 2 de la spec §4).
#
# Lisez ceci avant de déployer : sur le plan gratuit de Render, le disque est
# ÉPHÉMÈRE. Il est effacé à chaque déploiement, à chaque redémarrage et après
# chaque mise en veille. Une base SQLite posée dessus disparaît, et vous
# repartez de zéro sans aucun message d'erreur — précisément le scénario contre
# lequel toute la §1 est écrite.
#
# Un disque persistant est une option payante (plan Starter). Le stockage
# durable est donc EXTERNE : PostgreSQL chez Neon depuis le 2026-09-10.
#
# Turso l'a précédé et a coupé les lectures en pleine campagne. Les causes
# étaient chez nous et sont corrigées — payouts répétés à l'identique (95,1 %
# de redondance), synchronisations qui ne poussaient rien, ticks bruts à 97,6 %
# du volume écrit. Le volume est passé de 708 000 lignes par jour à 17 000.
# Mais une base dont le fournisseur peut bloquer les lectures à la frontière
# d'un quota ne convient pas à une collecte de quatorze jours.

services:
  - type: web
    name: maxprofit-collector
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free             # possible SANS disque : la base est chez Neon
    healthCheckPath: /ping # vivacité du processus. /health (503 si la collecte
                           # est morte) est fait pour un moniteur externe, pas
                           # pour l'auto-redémarrage : un redémarrage ne répare
                           # pas une source de données coupée.
    # PAS de disque : le conteneur n'écrit aucun fichier de données. La base
    # est distante, l'offre gratuite convient.
    envVars:
      # Stockage DURABLE. Sans cette variable, la collecte repartirait de zéro
      # à chaque redémarrage. Le code refuse une URL qui n'est pas du
      # PostgreSQL plutôt que de retomber en silence sur le disque local.
      - key: DATABASE_URL
        sync: false
      # Les ticks REVIENNENT, sous une autre forme. Ce qui a été coupé le
      # 10 septembre, c'est UNE LIGNE PAR TICK : 620 003 ticks/jour, 8,7
      # millions de lignes sur quatorze jours, ~1 Go pour 0,5 Go de quota. La
      # mesure était bonne et la décision l'était aussi.
      #
      # Ce qui a changé n'est pas le quota, c'est ce qu'on sait. Tout ce qui a
      # été cherché à la résolution d'une minute est revenu vide : 46
      # hypothèses simples, 1 402 conjonctions sous test de permutation, un
      # modèle en validation glissante dont la précision BAISSE quand sa
      # confiance monte. Or la minute est un résumé de soixante secondes d'un
      # processus qui bat à la seconde : on jetait environ soixante fois
      # l'information avant de conclure qu'il n'y avait rien dedans.
      #
      # `tick_paths` (schéma v4) écrit une ligne par MINUTE, delta-encodée et
      # compressée. Mesuré contre la base Neon, minute réelle de 118 ticks :
      # 265 octets. Soit ~21 Mo sur quatorze jours au lieu de ~1 Go, SANS
      # PERTE — et les résolutions 1 s / 5 s / 15 s / 30 s redeviennent
      # calculables.
      - key: STOCKER_TICKS
        value: "1"
      - key: MIN_PAYOUT_PCT
        value: "92"
      # Les secrets ne sont pas dans ce fichier : ils se saisissent dans le
      # tableau de bord Render, pour ne jamais entrer dans git.
      # Jeton de session du broker. Il EXPIRE : le service alerte alors sur
      # Telegram et attend un jeton neuf, sans redémarrer en boucle. Vous n'avez
      # pas à revenir ici — `capturer_ssid.py --envoyer` le pousse directement.
      - key: POCKET_OPTION_SSID
        sync: false
      # Le jeton reçu en cours de route est réécrit sur le disque ÉPHÉMÈRE du
      # conteneur : il ne survit ni à un redéploiement ni à une mise en veille.
      # C'est `POCKET_OPTION_SSID` ci-dessus qui fait foi au démarrage.
      - key: POCKET_OPTION_SESSION_FILE
        value: /tmp/session.json
      # Alertes et renouvellement à distance. Les deux vont ensemble : un jeton
      # sans identifiant de conversation donnerait un bot sans liste blanche,
      # pilotable par quiconque le découvre.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Facultatif désormais : le bot accepte plusieurs opérateurs, qui
      # s'inscrivent par /start <code>. Le garder évite d'avoir à s'inscrire
      # pour recevoir la première alerte.
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Code d'inscription administrateur. À traiter comme un mot de passe :
      # il donne le droit de changer le compte de courtier collecté.
      - key: TELEGRAM_ACCESS_CODE
        sync: false
      # Facultatif : inscription en consultation seule.
      - key: TELEGRAM_VIEWER_CODE
        sync: false
      # Secret partagé protégeant POST /session. Sans lui la route répond 404 :
      # un point d'entrée acceptant un jeton sans authentification permettrait
      # de détourner la collecte vers un autre compte.
      - key: ADMIN_SECRET
        sync: false

      # --- La course du plan, dans un THREAD de ce service ---------------
      #
      # Un service worker séparé demanderait une instance payante. La course
      # partage donc ce processus, et tout le confinement est dans
      # `hosting/course.py` : aucune exception n'en sort — y compris une
      # erreur de programmation, ce qui est interdit partout ailleurs dans ce
      # projet — elle renonce après cinq échecs plutôt que de marteler le
      # broker, et son thread est `daemon`. La collecte vaut plus que la
      # course : quatorze jours de série continue ne se rattrapent pas, dix
      # jours de course si.
      #
      # Elle ne pose AUCUN fichier : son journal et son état vivent dans la
      # base Neon (migration v5). Le disque éphémère ne peut donc rien lui
      # faire — la leçon de la §1.1, appliquée avant d'en payer le prix une
      # seconde fois.
      #
      # INACTIVE par défaut, et ce n'est pas de la prudence décorative : le
      # code est déployé AVANT d'être utilisé, pour que ses imports et son
      # démarrage soient éprouvés en production sans qu'un seul ordre ne
      # parte. Passer à "1" démarre la course de dix jours.
      # `sync: false` VOLONTAIREMENT : la valeur se règle dans le tableau de
      # bord et rien ne la réécrit. Une valeur en dur ici serait réimposée à
      # la prochaine synchronisation du blueprint et ARRÊTERAIT une course en
      # train de tourner — c'est exactement ce qui est arrivé à
      # STOCKER_TICKS, dans l'autre sens.
      #
      # Absente = inactive. Mettre "1".
      - key: PLAN_DEMO
        sync: false
      # Date de DÉPART, format 2026-09-22 (UTC) ou epoch. La course démarre
      # toute seule à cette heure-là : le lancement ne dépend pas d'un geste
      # fait le bon jour. Absente = départ immédiat.
      - key: PLAN_DEBUT
        sync: false
      - key: PLAN_CAPITAL
        value: "250"
      # 18 sessions/jour est un PLAFOND, pas un objectif : l'hypothèse produit
      # ~26 signaux/jour et une session en consomme 1,6, donc ~16 sessions
      # sont réellement atteignables. Les journées se termineront sur
      # SESSIONS_EPUISEES faute de signaux, pas faute d'objectif.
      - key: PLAN_SESSIONS
        value: "18"
      - key: PLAN_JOURS
        value: "30"
      # L'UNIVERS, et c'est la variable qui décide de ce que la course prouve.
      #
      #   epinglees  les quatre paires où l'hypothèse a été PRÉ-INSCRITE
      #              (registre #58, #59). Seule campagne qui puisse la valider
      #              hors échantillon — et une validation brûlée ne se refait
      #              pas. Les bougies viennent de NOTRE base : même source que
      #              le backtest, aucun appel au broker.
      #   plafond    tous les actifs au payout maximal, ~39 sur 146 ouverts.
      #              Dix fois plus de signaux, mais sur un univers qui n'est
      #              pas celui de l'hypothèse — actions, crypto, devises
      #              exotiques. Un solde qui monte n'y confirmerait RIEN.
      #
      # Le défaut est `epinglees`. Le test de la chaîne — signal, mise, ordre,
      # solde, gardes — se fait de toute façon dès les premiers ordres : c'est
      # un sous-produit, pas une campagne à part.
      - key: PLAN_UNIVERS
        sync: false

