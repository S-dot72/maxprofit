[project]
name = "maxprofit"
version = "0.0.0"
description = "Bot de signaux évolutif — voir SPEC_bot_evolutif.md"
requires-python = ">=3.11"
# Le noyau, la persistance et le collecteur n'utilisent que la
# bibliothèque standard. aiohttp ne sert qu'à la sonde HTTP exigée par
# l'hébergeur (voir requirements.txt pour le détail du raisonnement).
dependencies = [
    "aiohttp>=3.10,<4",
    # Base IANA des fuseaux. Absente de Windows et des images slim :
    # sans elle, zoneinfo ne connaît pas America/Port-au-Prince.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Adaptateur broker. Volontairement OPTIONNEL : il tire pandas et pywebview,
# dont ni le noyau, ni la persistance, ni le backtest n'ont besoin. Seul le
# collecteur en production l'installe.
pocketoption = [
    # Commit épinglé : voir requirements-broker.txt pour le raisonnement.
    "pocketoptionapi @ https://github.com/Mastaaa1987/PocketOptionAPI-v2/archive/c94c2b087f4cc9735c2171adc4d6dcb2c85b981f.tar.gz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
